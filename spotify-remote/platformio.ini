; Spotify remote for the Waveshare ESP32-S3-Touch-LCD-3.49 (640x172 landscape).
;
; Two environments, one per board revision. They differ only in the Revision.h
; they select and (for rev1) the QSPI host -- see board notes section 3.
;   pio run -e rev2 -t upload
;   pio run -e rev1 -t upload

[platformio]
default_envs = rev2

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-r8-opi              ; custom: 16MB QIO flash + 8MB OPI PSRAM
framework = arduino
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.9/esp32-core-3.3.9.tar.xz
  framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.9/esp32-core-3.3.9-libs.tar.xz

monitor_speed = 115200
monitor_filters = default, time, esp32_exception_decoder
upload_speed = 460800

lib_deps =
  https://github.com/moononournation/Arduino_GFX.git
  bblanchon/ArduinoJson@^7.4.2
  bitbank2/JPEGDEC@^1.8.2

build_flags =
  -std=gnu++2a
  -DCORE_DEBUG_LEVEL=3
  -DLOG_LOCAL_LEVEL=CORE_DEBUG_LEVEL
  -DESP32QSPI_MAX_PIXELS_AT_ONCE=2048   ; 4 KB per SPI transaction instead of 2 KB
build_unflags =
  -std=gnu++11
  -std=gnu++17

[env:rev2]
build_flags =
  ${env.build_flags}
  -DBOARD_REVISION_HEADER=\"platform/rev2/Revision.h\"
  ; rev2 uses the library-default SPI2_HOST

[env:rev1]
build_flags =
  ${env.build_flags}
  -DBOARD_REVISION_HEADER=\"platform/rev1/Revision.h\"
  -DESP32QSPI_SPI_HOST=SPI3_HOST
